name: Android Debug APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Quellcode laden
        uses: actions/checkout@v4
      - name: Node.js vorbereiten
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Java vorbereiten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Android SDK vorbereiten
        uses: android-actions/setup-android@v4
      - name: Alle App-Dateien kontrollieren
        run: |
          set -euo pipefail
          # If this is the PWA repository, copy the whole web project to www/.
          # Do not silently keep a stale www/ directory.
          if [ ! -e www/index.html ] && [ -e index.html ]; then
            mkdir -p www
            cp -v index.html app.js style.css icon.svg manifest.webmanifest www/
            for file in *-extra.js finance-engine.js tool-planner.js home-tools.js sw.js; do
              if [ -f "$file" ]; then cp -v "$file" www/; fi
            done
          fi
          python3 scripts/verify_android_bundle.py --source
      - name: Capacitor installieren
        run: npm install --no-audit --no-fund
      - name: Android-Projekt erstellen
        run: npx cap add android
      - name: Web-Dateien in Android-Projekt übernehmen
        run: npx cap sync android
      - name: Debug-APK bauen
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon
      - name: APK-Dateien nach dem Build verifizieren
        run: python3 scripts/verify_android_bundle.py --apk android/app/build/outputs/apk/debug/app-debug.apk
      - name: Installierbare Test-APK bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: Budget-Studio-Android-Test-APK-098-KOMPLETT
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

name: Android Debug APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Quellcode laden
        uses: actions/checkout@v4
      - name: Node.js vorbereiten
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Java vorbereiten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Android SDK vorbereiten
        uses: android-actions/setup-android@v4
      - name: Web-App-Dateien prüfen und vorbereiten
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f www/index.html ]; then
            if [ -f index.html ]; then
              echo "App-Dateien liegen im Repository-Hauptordner. Erstelle www/."
              mkdir -p www
              for file in index.html app.js style.css icon.svg manifest.webmanifest; do
                if [ -f "$file" ]; then cp "$file" "www/$file"; fi
              done
            else
              echo "FEHLER: Weder www/index.html noch index.html im Hauptordner gefunden."
              echo "Bitte www/ aus dem Android-Starterprojekt ins Repository hochladen."
              find . -maxdepth 3 -type f -not -path './.git/*' | sort | head -80
              exit 1
            fi
          fi
          for file in index.html app.js style.css icon.svg manifest.webmanifest; do
            if [ ! -f "www/$file" ]; then
              echo "FEHLER: www/$file fehlt. Bitte die vollständigen Web-Dateien hochladen."
              exit 1
            fi
          done
          echo "Alle Web-Dateien vorhanden:"
          ls -lh www/
      - name: Capacitor installieren
        run: npm install --no-audit --no-fund
      - name: Android-Projekt erstellen
        run: npx cap add android
      - name: Web-Dateien in Android-Projekt übernehmen
        run: npx cap sync android
      - name: Debug-APK bauen
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon
      - name: Installierbare Test-APK bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: Budget-Studio-Android-Test-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
